[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sortefi-ta"
version = "0.1.0"
description = "Technical indicators, candlestick patterns, chart patterns and price maths for pandas — pure numpy/pandas, no C install."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sortefi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
keywords = ["technical-analysis", "indicators", "candlestick", "trading", "pandas", "screener"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://sortefi.com"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
